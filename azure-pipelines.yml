trigger: 
- none

pool:
  'AgentPool_VmssUbuntu'
  # vmImage: 'ubuntu-latest'

jobs: 
  - job: RetrieveBlobJob
    steps:
      - task: AzureCLI@2
        displayName: 'Download resource from NCIS blob storage'
        inputs:
          azureSubscription: 'DevOpsServiceConnection_EcDc-NCIS-rg'
          scriptType: 'pscore'
          scriptLocation: 'inlineScript'
          inlineScript: |
            az storage blob download `
              --account-name ecdcncisst `
              --container-name ethan-resources `
              --name pipeline_test.txt `
              --file $(System.DefaultWorkingDirectory)\pipeline_test.txt `

            #cat "pipeline_test.txt"

    variables:
      file_name: 'pipeline_test.txt' #change to demand user input
      is_star: 'no' #change to demand user input

  - job: setPythonVersion
    dependsOn: RetrieveBlobJob
    steps:
    - task: UsePythonVersion@0
      inputs:
        versionSpec: '3.13.14'
      displayName: 'Set up Python 3.13.14'

    - script: |
        cd DMS_ParamListGenerator
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        python working_pipeline.py "$(file_name)" "$(is_star)"
      displayName: 'Install dependencies and run script'

    #change below to output unique values only
    - script: |
        cd DMS_ParamListGenerator
        cat 'pipeline_test_output.csv' 
      displayName: 'Showing file contents'