trigger:
- None

pool:
  'AgentPool_VmssUbuntu'

variables:
  file_name: ''
  is_star: ''

steps:
- task: UsePythonVersion@0
  inputs:
    versionSpec: '3.13.14'
  displayName: 'Set up Python 3.13.14'

- script: |
    python -m pip install --upgrade pip
    pip install -r DMS_ParamListGenerator/requirements.txt
    python DMS_ParamListGenerator/working_pipeline.py "$(file_name)" "$(is_star)"
  displayName: 'Install dependencies and run script'